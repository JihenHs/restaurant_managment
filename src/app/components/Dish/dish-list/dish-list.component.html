<div class="dish-list">
  <h2 class="title"> Liste des Plats</h2>


  <div *ngIf="canEditOrDelete()">
    <button [appRoleVisibility]="['admin', 'cuisinier']" (click)="toggleAddDishForm()">
      {{ showAddDishForm ? 'Annuler' : 'Ajouter un plat' }}
    </button>
    
    
  </div>

  
  <div *ngIf="showAddDishForm" class="add-dish-form">
    
  </div>


  <div *ngIf="dishes.length > 0; else noDishes">
    <table>
      <thead>
        <tr>
          <th>Nom</th>
          <th>Description</th>
          <th>Prix</th>
          <th>Catégorie</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let dish of dishes">
          <td>{{ dish.name | uppercase }}</td>
          <td>{{ dish.description }}</td>
          <td>{{ dish.price | currency:'EUR' }}</td>
          <td>{{ dish.category | titlecase }}</td>
          <td>
         
            <div *ngIf="canEditOrDelete(); else noActions">
              <button [appRoleVisibility]="['admin', 'cuisinier']" (click)="editDish(dish)">Éditer</button>
              <button [appRoleVisibility]="['admin', 'cuisinier']" (click)="deleteDish(dish._id)">Supprimer</button></div>
            <ng-template #noActions>-</ng-template>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #noDishes>
    <p>Aucun plat trouvé.</p>
  </ng-template>
</div>
